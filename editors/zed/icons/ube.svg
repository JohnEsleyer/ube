<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 75 330 505" width="100%" height="100%">
  <defs>
    <linearGradient id="ubeJamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a156d"/>
      <stop offset="60%" stop-color="#300a4b"/>
      <stop offset="100%" stop-color="#1f0433"/>
    </linearGradient>
    <linearGradient id="meniscusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#671f92"/>
      <stop offset="100%" stop-color="#451263"/>
    </linearGradient>
  </defs>

  <!-- Offset Shadow -->
  <g id="jar-offset-shadow" transform="translate(14, 12)">
    <rect x="145" y="94" width="210" height="44" rx="12" fill="#d9cbf2"/>
    <rect x="155" y="136" width="190" height="20" rx="8" fill="#d9cbf2"/>
    <path d="M 160,154 C 135,178 115,208 115,246 L 115,480 C 115,530 160,554 250,554 C 340,554 385,530 385,480 L 385,246 C 385,208 365,178 340,154 Z" fill="#d9cbf2"/>
  </g>

  <!-- Main Jam Jar -->
  <g id="jam-jar">
    <!-- Outer Glass Body -->
    <path d="M 160,154 C 135,178 115,208 115,246 L 115,480 C 115,530 160,554 250,554 C 340,554 385,530 385,480 L 385,246 C 385,208 365,178 340,154 Z" fill="#ffffff" stroke="#180928" stroke-width="12" stroke-linejoin="round"/>
    <!-- Jam Fill -->
    <path d="M 142,230 L 142,474 C 142,508 178,526 250,526 C 322,526 358,508 358,474 L 358,230 Z" fill="url(#ubeJamGrad)"/>
    <!-- Meniscus -->
    <ellipse cx="250" cy="230" rx="108" ry="24" fill="#240638"/>
    <ellipse cx="250" cy="229" rx="98" ry="18" fill="url(#meniscusGrad)"/>
    <ellipse cx="250" cy="227" rx="86" ry="11" fill="#7a24b3" opacity="0.6"/>
    <!-- Flecks -->
    <g fill="none" stroke="#6f21a3" stroke-width="4.5" stroke-linecap="round" opacity="0.65">
      <path d="M 180,265 C 184,272 184,282 178,288"/>
      <path d="M 285,280 C 291,286 291,294 286,300"/>
      <path d="M 218,315 C 224,320 232,320 238,315"/>
      <path d="M 322,345 C 326,352 324,360 318,366"/>
      <path d="M 202,390 C 208,396 216,396 222,390"/>
      <path d="M 268,418 C 274,425 272,434 265,440"/>
      <path d="M 175,450 C 180,456 188,456 193,450"/>
      <path d="M 302,472 C 308,476 316,476 321,470"/>
    </g>
    <!-- Highlights -->
    <path d="M 152,246 L 152,460 C 152,478 158,490 172,498" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <path d="M 168,252 L 168,340" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 195,540 C 230,544 270,544 305,540" fill="none" stroke="#180928" stroke-width="5" stroke-linecap="round" opacity="0.25"/>
    <path d="M 370,250 C 375,320 375,410 365,470" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <!-- Collar & Lid -->
    <rect x="155" y="136" width="190" height="20" rx="8" fill="#ffffff" stroke="#180928" stroke-width="11"/>
    <rect x="145" y="94" width="210" height="44" rx="12" fill="#ffffff" stroke="#180928" stroke-width="12"/>
    <g stroke="#180928" stroke-width="5" stroke-linecap="round">
      <line x1="172" y1="102" x2="172" y2="130"/>
      <line x1="198" y1="102" x2="198" y2="130"/>
      <line x1="224" y1="102" x2="224" y2="130"/>
      <line x1="250" y1="102" x2="250" y2="130"/>
      <line x1="276" y1="102" x2="276" y2="130"/>
      <line x1="302" y1="102" x2="302" y2="130"/>
      <line x1="328" y1="102" x2="328" y2="130"/>
    </g>
    <line x1="160" y1="94" x2="340" y2="94" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
