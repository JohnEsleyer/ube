name = "Ube"
grammar = "ube"
path_suffixes = ["ube"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
word_characters = ["_"]

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false },
]

autoclose_before = ";:.,=}])> \n\t"

tab_size = 4
hard_tabs = false
