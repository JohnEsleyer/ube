output_file: codebase.txt
format: tags
tree: true
max_file_size: 512000

# # Group extraction modes (Signatures vs Full Code)
# signatures_groups:
#   - wasm_binary
#   - formatter
#   - lsp

# full_code_groups:
#   - _wasm_sandbox
#   - tests
#   - cli
#   - compiler

# Group mode mappings
groups:
  cli: signatures
  compiler: signatures
  wasm_binary: signatures
  lsp: signatures
  formatter: signatures
  wasm_sandbox: full
  tests: signatures
  docs: full
  editors: full

dirs:
  # CLI Entrypoints & Commands
  cmd/ube:
    enabled: true
    group: cli
    extensions:
      - go
      - txt
      - md

  # Core Compiler Engine (Frontend, Typechecker, Monomorphizer, Wasm Emitter)
  pkg/compiler:
    enabled: true
    group: compiler
    extensions:
      - go
      - ube
      - txt
      - md

  # Low-Level WebAssembly Binary Encoder & LEB128 Buffers
  pkg/wasm:
    enabled: true
    group: wasm_binary
    extensions:
      - go
      - txt
      - md

  # Language Server Protocol Implementation
  pkg/lsp:
    enabled: true
    group: lsp
    extensions:
      - go
      - txt
      - md

  # Canonical Code Formatter
  pkg/formatter:
    enabled: true
    group: formatter
    extensions:
      - go
      - txt
      - md

  # WebAssembly Isolated Sandbox & Reference Laboratory
  _wasm_sandbox:
    enabled: false
    group: wasm_sandbox
    extensions:
      - ube
      - txt
      - md
      - wat
      - sh

  # Language Integration Test Suite
  tests:
    enabled: true
    group: tests
    extensions:
      - ube
      - txt
      - md

  # Architecture Specifications, Post-Mortems & Plans
  _dev:
    enabled: false
    group: docs
    extensions:
      - txt
      - md
  
  # Editor
  editors:
    enabled: true
    group: editors