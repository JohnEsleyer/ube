output_file: codebase.txt
format: tags
tree: true
max_file_size: 512000

# # Group extraction modes (Signatures vs Full Code)
# signatures_groups:
#   - wasm_binary
#   - formatter
#   - lsp

# full_code_groups:
#   - _wasm_sandbox
#   - tests
#   - cli
#   - compiler

# Group mode mappings
# Target-partitioned groups let developers and AI agents extract exactly one
# compilation stack:
#   textify start --group=wasi1  -> WASI Preview 1 backend + stdlib only
#   textify start --group=wasi2  -> WASI 0.2 component-model backend + stdlib only
#   textify start --group=frontend -> target-agnostic compiler frontend + CLI
groups:
  cli: signatures
  compiler: signatures
  frontend: full
  wasi1: full
  wasi2: full
  common_std: signatures
  wasm_binary: signatures
  lsp: signatures
  formatter: signatures
  wasm_sandbox: full
  tests: signatures
  docs: full
  editors: signatures

dirs:
  # CLI Entrypoints & Commands
  cmd/ube:
    enabled: true
    group: frontend
    extensions:
      - go
      - txt
      - md

  # Core Compiler Engine (Frontend, Typechecker, Monomorphizer, IR)
  # Target-agnostic: emits core WebAssembly modules only, no WASI specifics.
  pkg/compiler:
    enabled: true
    group: frontend
    extensions:
      - go
      - ube
      - txt
      - md

  # Low-Level WebAssembly Binary Encoder & LEB128 Buffers
  pkg/wasm:
    enabled: true
    group: frontend
    extensions:
      - go
      - txt
      - md

  # Target Backend Contract (Backend interface + TargetConfig)
  pkg/targets:
    enabled: true
    group: frontend
    extensions:
      - go
      - txt
      - md

  # WASI Preview 1 (0.1) Target Backend & Stdlib
  pkg/targets/wasi1:
    enabled: true
    group: wasi1
    extensions:
      - go
      - txt
      - md

  std/wasi1:
    enabled: true
    group: wasi1
    extensions:
      - ube
      - txt
      - md

  # WASI 0.2 (Preview 2) Component-Model Target Backend & Stdlib
  pkg/targets/wasi2:
    enabled: true
    group: wasi2
    extensions:
      - go
      - txt
      - md

  std/wasi2:
    enabled: true
    group: wasi2
    extensions:
      - ube
      - txt
      - md

  # Language Server Protocol Implementation
  pkg/lsp:
    enabled: true
    group: lsp
    extensions:
      - go
      - txt
      - md

  # Canonical Code Formatter
  pkg/formatter:
    enabled: true
    group: formatter
    extensions:
      - go
      - txt
      - md

  # WebAssembly Isolated Sandbox & Reference Laboratory
  _wasm_sandbox:
    enabled: true
    group: wasm_sandbox
    extensions:
      - ube
      - txt
      - md
      - wat
      - sh

  # Language Integration Test Suite
  tests:
    enabled: false
    group: tests
    extensions:
      - ube
      - txt
      - md

  # Architecture Specifications, Post-Mortems & Plans
  _dev:
    enabled: false
    group: docs
    extensions:
      - txt
      - md
  
  # Editor
  editors:
    enabled: false
    group: editors